<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN GYM POS</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:20px;color:#111}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 3px 10px #ddd}
button{padding:12px 18px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px}
input{padding:12px;width:90%;margin:5px;border-radius:8px;border:1px solid #ccc}
h1{color:#111827}
.stat{display:inline-block;width:42%;padding:15px;margin:5px;background:white;border-radius:15px}
</style>
</head>
<body>

<h1>TITAN GYM<br><small>Member POS & Renewal Monitor</small></h1>

<div class="card">
<h2>Add Member</h2>
<input id="id" placeholder="Member ID">
<input id="name" placeholder="Name">
<input id="contact" placeholder="Contact">
<input id="plan" placeholder="Membership Plan">
<input id="expiry" placeholder="Expiry Date YYYY-MM-DD">
<button onclick="addMember()">Save Member</button>
<p id="msg"></p>
</div>

<div class="card">
<h2>QR / Member Check</h2>
<input id="scan" placeholder="Enter Member ID">
<button onclick="check()">Check In</button>
<p id="result"></p>
</div>

<div class="card">
<h2>Dashboard</h2>
<div class="stat">Total Members<br><b id="total">0</b></div>
<div class="stat">Active<br><b id="active">0</b></div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbz9cwYl4Co3n31Lpov6T9MU_aTitTCWYBoqYoGirJebjL0GU9oAJFAfOvJAnunNN8gX/exec";

async function addMember(){
 let data={
 action:"newmember",
 memberId:id.value,
 name:name.value,
 contact:contact.value,
 membershipPlan:plan.value,
 expiryDate:expiry.value
 };

 let r=await fetch(API,{method:"POST",body:JSON.stringify(data)});
 let j=await r.json();
 msg.innerText=j.message || JSON.stringify(j);
 load();
}

async function check(){
 let r=await fetch(API,{
 method:"POST",
 body:JSON.stringify({
 action:"scan",
 memberId:scan.value
 })
 });
 let j=await r.json();
 result.innerText=JSON.stringify(j);
}

async function load(){
 let r=await fetch(API+"?action=members");
 let j=await r.json();

 if(j.members){
 total.innerText=j.members.length-1;
 let a=0;
 j.members.slice(1).forEach(x=>{
   if(x[6]=="ACTIVE")a++;
 });
 active.innerText=a;
 }
}
load();
</script>

</body>
</html>
